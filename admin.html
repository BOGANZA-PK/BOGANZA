<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOGANZA Admin</title>
<style>body{font-family:sans-serif;background:#fdfbf7;padding:15px}input,textarea,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px}button{padding:11px 16px;border:none;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer;margin:4px 2px}.card{background:#fff;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}.card img{width:100%;height:180px;object-fit:cover;border-radius:10px}.green{background:#25D366}.gold{background:#b88a2a}.red{background:#e74c3c}.tab{padding:10px 18px;background:#fff;border:1px solid #ddd;border-radius:20px;cursor:pointer}.tab.active{background:#111;color:#fff}</style></head>
<body>
<h1>BOGANZA Admin Panel 🔐</h1>
<div id="login"><p>Password daalo:</p><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p style="font-size:13px;color:#888">Password: boganza123</p></div>
<div id="panel" style="display:none">
<div><button class="tab active" onclick="showTab('orders',this)">📦 Orders</button> <button class="tab" onclick="showTab('products',this)">👜 Products</button> <button class="tab" onclick="showTab('settings',this)">⚙️ Settings</button></div>

<div id="tab-orders"><h2>📦 Saare Orders (<span id="orderCount">0</span>)</h2><button class="green" onclick="exportOrders()">WhatsApp pe bhejo / Copy karo</button> <button class="red" onclick="clearOrders()">Saare Orders Delete</button><div id="orderList"></div></div>

<div id="tab-products" style="display:none"><h2>👜 Products</h2><div id="list"></div><h2>➕ Naya Bag</h2><div class="card">Naam<input id="nName">Category<input id="nCat" placeholder="Tote / Handbag / Clutch / Crossbody">Price<input id="nPrice" type="number">Old Price<input id="nOld" type="number">Photo Link<input id="nImg" placeholder="https://...">Description<textarea id="nDesc"></textarea><button class="gold" onclick="addProduct()">Add Bag ✅</button></div></div>

<div id="tab-settings" style="display:none"><h2>📞 Numbers</h2><div class="card">WhatsApp Number (92 ke saath)<input id="waNum">Display Number<input id="displayNum">JazzCash<input id="jazzNum">EasyPaisa<input id="easyNum"><button class="green" onclick="saveSettings()">Save Number ✅</button></div></div>
<br><button onclick="location.href='index.html'">Website Dekho →</button>
</div>
<script>
function login(){if(document.getElementById('pass').value==="boganza123"){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';loadAll();}else alert("Galat password!");}
function showTab(t,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['orders','products','settings'].forEach(x=>document.getElementById('tab-'+x).style.display=x===t?'block':'none');}
let products=JSON.parse(localStorage.getItem('boganza_products')||"null");
let settings=JSON.parse(localStorage.getItem('boganza_settings')||'{"wa":"923001234567","display":"0300-1234567","jazz":"0300-1234567","easy":"0300-1234567"}');
if(!products){products=[{name:"The Everyday Tote",cat:"Tote",price:3499,old:4999,desc:"Spacious tote",colors:["Black"],imgs:["https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=800"]},{name:"Mini Crossbody",cat:"Crossbody",price:2499,old:3299,desc:"Crossbody",colors:["Black"],imgs:["https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=800"]},{name:"Chic Shoulder Bag",cat:"Handbag",price:2999,old:3999,desc:"Shoulder bag",colors:["Black"],imgs:["https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=800"]},{name:"Luxury Handbag",cat:"Handbag",price:4499,old:5999,desc:"Luxury",colors:["Black"],imgs:["https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=800"]},{name:"Evening Clutch",cat:"Clutch",price:1999,old:2799,desc:"Clutch",colors:["Golden"],imgs:["https://images.unsplash.com/photo-1591561954557-26941169b49e?w=800"]}];}
function save(){localStorage.setItem('boganza_products',JSON.stringify(products));localStorage.setItem('boganza_settings',JSON.stringify(settings));}
function loadAll(){document.getElementById('waNum').value=settings.wa;document.getElementById('displayNum').value=settings.display;document.getElementById('jazzNum').value=settings.jazz;document.getElementById('easyNum').value=settings.easy;
let orders=JSON.parse(localStorage.getItem('boganza_orders')||"[]");document.getElementById('orderCount').innerText=orders.length;
let oh="";if(orders.length==0)oh="<p>Abhi koi order nahi aaya.</p>";orders.slice().reverse().forEach((o,i)=>{let idx=orders.length-1-i;oh+=`<div class="card"><b>Order #${idx+1} - ${o.date||''}</b><br>👤 ${o.name} | 📞 ${o.phone}<br>📍 ${o.city}, ${o.address}<br>👜 ${o.items}<br>💰 Total: Rs. ${o.total} | 💳 ${o.payment}<br>Status: <b>${o.status||'New'}</b><br><button class="green" onclick="changeStatus(${idx},'Delivered')">Delivered ✅</button> <button class="gold" onclick="changeStatus(${idx},'Pending')">Pending</button> <button class="red" onclick="delOrder(${idx})">Delete</button> <button onclick="window.open('https://wa.me/${o.phone.replace(/[^0-9]/g,'')}')">WhatsApp Customer</button></div>`});document.getElementById('orderList').innerHTML=oh;
let h="";products.forEach((p,i)=>{h+=`<div class="card"><img src="${p.imgs[0]}">Naam<input value="${p.name}" onchange="products[${i}].name=this.value;save();loadAll()">Price<input type="number" value="${p.price}" onchange="products[${i}].price=+this.value;save()">Old Price<input type="number" value="${p.old}" onchange="products[${i}].old=+this.value;save()">Photo Link<input value="${p.imgs[0]}" onchange="products[${i}].imgs[0]=this.value;save()">Category<input value="${p.cat}" onchange="products[${i}].cat=this.value;save()"><button class="red" onclick="products.splice(${i},1);save();loadAll()">Delete ❌</button></div>`});document.getElementById('list').innerHTML=h;}
function changeStatus(i,s){let o=JSON.parse(localStorage.getItem('boganza_orders')||"[]");o[i].status=s;localStorage.setItem('boganza_orders',JSON.stringify(o));loadAll();}
function delOrder(i){if(confirm("Delete kar dun?")){let o=JSON.parse(localStorage.getItem('boganza_orders')||"[]");o.splice(i,1);localStorage.setItem('boganza_orders',JSON.stringify(o));loadAll();}}
function clearOrders(){if(confirm("Saare orders delete kar dun?")){localStorage.removeItem('boganza_orders');loadAll();}}
function saveSettings(){settings={wa:document.getElementById('waNum').value,display:document.getElementById('displayNum').value,jazz:document.getElementById('jazzNum').value,easy:document.getElementById('easyNum').value};save();alert("Save ho gaya ✅");}
function addProduct(){products.push({name:document.getElementById('nName').value,cat:document.getElementById('nCat').value,price:+document.getElementById('nPrice').value,old:+document.getElementById('nOld').value,desc:document.getElementById('nDesc').value,colors:["Black"],imgs:[document.getElementById('nImg').value]});save();loadAll();alert("Add ho gaya ✅");}
function exportOrders(){let o=JSON.parse(localStorage.getItem('boganza_orders')||"[]");let t=o.map((x,i)=>`Order ${i+1}: ${x.name}, ${x.phone}, ${x.city}, ${x.items}, Rs.${x.total}`).join("\n");navigator.clipboard.writeText(t);alert("Copy ho gaya, ab WhatsApp pe paste kar do ✅");}
</script></body></html>
