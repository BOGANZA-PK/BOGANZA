<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOGANZA Admin</title>
<style>body{font-family:sans-serif;background:#fdfbf7;padding:15px}input,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px}button{padding:11px 16px;border:none;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer;margin:4px 2px}.card{background:#fff;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}.card img{width:100%;height:180px;object-fit:cover;border-radius:10px}.green{background:#25D366}.gold{background:#b88a2a}.red{background:#e74c3c}</style></head>
<body>
<h1>BOGANZA Admin Panel 🔐</h1>
<div id="login"><p>Password daalo:</p><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p style="font-size:13px;color:#888">Default password: boganza123</p></div>
<div id="panel" style="display:none">
<h2>📞 Number Settings</h2>
<div class="card">WhatsApp Number (92 ke saath, baghair 0 ke)<input id="waNum" placeholder="923001234567">Call / Display Number<input id="displayNum" placeholder="0300-1234567">JazzCash Number<input id="jazzNum" placeholder="0300-1234567">EasyPaisa Number<input id="easyNum" placeholder="0300-1234567"><button class="green" onclick="saveSettings()">Save Number ✅</button></div>
<h2>👜 Products</h2><div id="list"></div>
<h2>➕ Naya Bag Add Karo</h2><div class="card">Naam<input id="nName" placeholder="Bag Name">Category<input id="nCat" placeholder="Tote / Handbag / Clutch / Crossbody">Price<input id="nPrice" type="number" placeholder="3499">Old Price<input id="nOld" type="number" placeholder="4999">Photo Link<input id="nImg" placeholder="https://...">Description<textarea id="nDesc" placeholder="Bag ki detail"></textarea><button class="gold" onclick="addProduct()">Add Bag ✅</button></div>
<button onclick="resetAll()" class="red">Sab Reset Karo</button> <button onclick="location.href='index.html'">Website Dekho →</button>
</div>
<script>
const DEFAULT_PASS="boganza123";
function login(){if(document.getElementById('pass').value===localStorage.getItem('boganza_pass')||document.getElementById('pass').value===DEFAULT_PASS){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load();}else alert("Galat password!");}
let products=JSON.parse(localStorage.getItem('boganza_products')||"null");
let settings=JSON.parse(localStorage.getItem('boganza_settings')||'{"wa":"923001234567","display":"0300-1234567","jazz":"0300-1234567","easy":"0300-1234567"}');
if(!products){products=[
{name:"The Everyday Tote",cat:"Tote",price:3499,old:4999,desc:"Spacious daily tote",colors:["Black","Brown"],imgs:["https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=800"]},
{name:"Mini Crossbody",cat:"Crossbody",price:2499,old:3299,desc:"Compact crossbody",colors:["Black","Pink"],imgs:["https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=800"]},
{name:"Chic Shoulder Bag",cat:"Handbag",price:2999,old:3999,desc:"Elegant shoulder bag",colors:["Black","Golden"],imgs:["https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=800"]},
{name:"Luxury Handbag",cat:"Handbag",price:4499,old:5999,desc:"Luxury handbag",colors:["Black","Brown"],imgs:["https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=800"]},
{name:"Evening Clutch",cat:"Clutch",price:1999,old:2799,desc:"Evening clutch",colors:["Golden","Black"],imgs:["https://images.unsplash.com/photo-1591561954557-26941169b49e?w=800"]}
];}
function load(){document.getElementById('waNum').value=settings.wa;document.getElementById('displayNum').value=settings.display;document.getElementById('jazzNum').value=settings.jazz;document.getElementById('easyNum').value=settings.easy;let h="";products.forEach((p,i)=>{h+=`<div class="card"><img src="${p.imgs[0]}">Naam<input value="${p.name}" onchange="products[${i}].name=this.value;save()">Price<input type="number" value="${p.price}" onchange="products[${i}].price=+this.value;save()">Old Price<input type="number" value="${p.old}" onchange="products[${i}].old=+this.value;save()">Photo Link<input value="${p.imgs[0]}" onchange="products[${i}].imgs[0]=this.value;save()">Category<input value="${p.cat}" onchange="products[${i}].cat=this.value;save()"><button class="green" onclick="save();alert('Save ho gaya ✅')">Save</button> <button class="red" onclick="products.splice(${i},1);save();load()">Delete ❌</button></div>`});document.getElementById('list').innerHTML=h;}
function save(){localStorage.setItem('boganza_products',JSON.stringify(products));localStorage.setItem('boganza_settings',JSON.stringify(settings));}
function saveSettings(){settings={wa:document.getElementById('waNum').value,display:document.getElementById('displayNum').value,jazz:document.getElementById('jazzNum').value,easy:document.getElementById('easyNum').value};save();alert("Number Save ho gaya ✅ Ab website pe naya number dikhega");load();}
function addProduct(){let p={name:document.getElementById('nName').value,cat:document.getElementById('nCat').value,price:+document.getElementById('nPrice').value,old:+document.getElementById('nOld').value,desc:document.getElementById('nDesc').value,colors:["Black"],imgs:[document.getElementById('nImg').value]};products.push(p);save();load();alert("Naya bag add ho gaya ✅");}
function resetAll(){if(confirm("Sab delete kar dun?")){localStorage.removeItem('boganza_products');location.reload();}}
</script></body></html>
